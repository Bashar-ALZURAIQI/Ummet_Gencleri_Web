<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script data-locale-bootstrap>
      (function () {
        try {
          var supported = ['ar', 'tr', 'en'];
          var storageKey = 'ummet_locale';
          var saved = localStorage.getItem(storageKey);
          var locale = supported.indexOf(saved) !== -1 ? saved : null;

          if (!locale && typeof navigator !== 'undefined') {
            var langs = navigator.languages || [navigator.language];
            if (langs) {
              for (var i = 0; i < langs.length; i++) {
                var lang = langs[i];
                if (typeof lang === 'string') {
                  var primary = lang.toLowerCase().split(/[-_]/)[0];
                  if (supported.indexOf(primary) !== -1) {
                    locale = primary;
                    break;
                  }
                }
              }
            }
          }

          if (!locale) {
            locale = 'ar';
          }

          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/union-push-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/union-push-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1739" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="شباب الأمة" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اتحاد شباب الأمة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
